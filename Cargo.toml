[package]
name = "shell-engine"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "An async shell runtime for persistent sessions, PTY I/O, output buffering, real-time callbacks, and screen snapshots."
repository = "https://github.com/ZEROLINGG/shell-engine"
documentation = "https://docs.rs/shell-engine"
homepage = "https://github.com/ZEROLINGG"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "time", "macros"] }
serde = { version = "1", features = ["derive"] }

strip-ansi-escapes = "0.2"
encoding_rs = "0.8"

rust-pty = { version = "0.5.0", optional = true}
vt100 = { version = "0.16.2", optional = true}


[target.'cfg(windows)'.dependencies]
codepage = "0.1"

[features]
default = [
    "pty"
]
pty = [
    "dep:rust-pty",
    "dep:vt100"
]