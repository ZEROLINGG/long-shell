[package]
name = "long_shell"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "time", "macros"] }
serde = { version = "1", features = ["derive"] }

encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
codepage = "0.1"